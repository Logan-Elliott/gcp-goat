[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gcp-goat"
version = "1.0.0"
description = "Authorized Gmail OAuth assessment toolkit for red and purple teams"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Logan Elliott", email = "dev.loganelliott@gmail.com" },
]
keywords = ["gmail", "oauth", "red-team", "purple-team", "security-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Flask",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=50,<51",
  "Flask>=3.0,<4",
  "google-api-python-client>=2.128,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "gunicorn>=22,<24",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
gcp-goat = "gcp_goat.cli:main"
gcp-goat-server = "gcp_goat.web:main"

[project.urls]
Repository = "https://github.com/Logan-Elliott/gcp-goat"

[tool.hatch.build.targets.wheel]
packages = ["src/gcp_goat"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
