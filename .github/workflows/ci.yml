name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=gcp_goat --cov-report=term-missing
      - if: matrix.python-version == '3.14'
        run: python -m pip wheel --no-deps --wheel-dir dist .

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag gcp-goat:ci .
      - name: Smoke-test container health endpoint
        run: |
          docker run --detach --name gcp-goat-ci --publish 127.0.0.1:8000:8000 \
            --env GMAIL_OAUTH_ENCRYPTION_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= \
            --env FLASK_SECRET_KEY=ci-only-secret \
            --env GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com \
            --env GOOGLE_CLIENT_SECRET=ci-only-secret \
            --env GOOGLE_REDIRECT_URI=http://127.0.0.1:8000/oauth/callback \
            gcp-goat:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              docker rm --force gcp-goat-ci
              exit 0
            fi
            sleep 1
          done
          docker logs gcp-goat-ci
          docker rm --force gcp-goat-ci
          exit 1
