name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=gcp_goat --cov-report=term-missing
      - if: matrix.python-version == '3.14'
        run: python -m pip install 'build>=1.2,<2'
      - if: matrix.python-version == '3.14'
        run: python -m build
      - if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: gcp-goat-distributions
          path: dist/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag gcp-goat:ci .
      - name: Smoke-test container health endpoint
        run: |
          docker run --detach --name gcp-goat-ci --publish 127.0.0.1:8000:8000 \
            --env GMAIL_OAUTH_ENCRYPTION_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= \
            --env FLASK_SECRET_KEY=ci-only-secret \
            --env GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com \
            --env GOOGLE_CLIENT_SECRET=ci-only-secret \
            --env GOOGLE_REDIRECT_URI=http://127.0.0.1:8000/oauth/callback \
            gcp-goat:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              docker rm --force gcp-goat-ci
              exit 0
            fi
            sleep 1
          done
          docker logs gcp-goat-ci
          docker rm --force gcp-goat-ci
          exit 1
